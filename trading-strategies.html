<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفترچه استراتژی‌های ترید</title>
<style>
  :root{
    --bg:#0f1420;
    --bg-soft:#161d2e;
    --card:#1b2338;
    --card-hover:#212b45;
    --border:#2a3450;
    --text:#e7ebf5;
    --muted:#9aa5c0;
    --gold:#d4af37;
    --teal:#2dd4bf;
    --red:#f87171;
    --green:#4ade80;
    --radius:14px;
    --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(1200px 800px at 80% -10%, #1a2440 0%, var(--bg) 60%);
    color:var(--text);
    font-family:"B Yekan","BYekan","Yekan","Vazirmatn","Segoe UI",Tahoma,sans-serif;
    min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(15,20,32,.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:16px 24px;
    display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
  }
  header h1{
    font-size:20px; margin:0; display:flex; align-items:center; gap:10px;
  }
  header h1 span.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);display:inline-block;}
  .search-wrap{flex:1; min-width:220px; max-width:480px; position:relative;}
  .search-wrap input{
    width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg-soft); color:var(--text); font-size:14px;
  }
  .btn{
    padding:10px 16px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); color:var(--text); cursor:pointer; font-size:14px;
    transition:.15s; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{background:var(--card-hover); border-color:var(--teal);}
  .btn.primary{background:linear-gradient(135deg,var(--teal),#22a696); color:#04231f; border:none; font-weight:600;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.gold{background:linear-gradient(135deg,var(--gold),#b8912b); color:#2a2205; border:none; font-weight:600;}
  .btn.danger{color:var(--red); border-color:rgba(248,113,113,.4);}
  .btn.danger:hover{background:rgba(248,113,113,.12);}
  .btn.small{padding:6px 10px; font-size:12px;}

  main{padding:24px; max-width:1200px; margin:0 auto;}
  .filter-panel{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:18px; display:flex; flex-wrap:wrap; gap:20px; align-items:flex-end;
  }
  .filter-group{display:flex; flex-direction:column; gap:6px;}
  .filter-group .ftitle{font-size:12px; color:var(--muted);}
  .filter-chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-size:12px; padding:6px 12px; border-radius:20px; border:1px solid var(--border);
    background:var(--bg-soft); color:var(--muted); cursor:pointer; user-select:none; transition:.15s;
  }
  .chip.active{background:rgba(45,212,191,.15); color:var(--teal); border-color:var(--teal);}
  .filter-group select, .filter-group input[type=number]{
    padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-soft); color:var(--text); font-size:13px; min-width:150px;
  }
  .filter-reset{margin-inline-start:auto;}
  .stats-bar{
    display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px;
  }
  .stat{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 18px; min-width:140px; flex:1;
  }
  .stat .label{font-size:12px; color:var(--muted);}
  .stat .value{font-size:22px; font-weight:700; margin-top:4px; color:var(--gold);}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; cursor:pointer; transition:.15s; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:8px;
  }
  .card:hover{border-color:var(--teal); transform:translateY(-2px);}
  .card .thumb-row{display:flex; gap:6px;}
  .card .thumb-row img{width:50%; height:80px; object-fit:cover; border-radius:8px; border:1px solid var(--border); background:#0c1120;}
  .card h3{margin:0; font-size:16px;}
  .badges{display:flex; gap:6px; flex-wrap:wrap;}
  .badge{
    font-size:11px; padding:3px 8px; border-radius:20px; border:1px solid var(--border);
    background:rgba(45,212,191,.08); color:var(--teal);
  }
  .card .meta{font-size:12px; color:var(--muted); display:flex; justify-content:space-between; margin-top:auto;}
  .card .meta b{color:var(--text);}
  .empty{
    text-align:center; padding:60px 20px; color:var(--muted);
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(5,8,16,.7); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:30px 14px; overflow:auto;
  }
  .modal{
    background:var(--bg-soft); border:1px solid var(--border); border-radius:var(--radius);
    width:100%; max-width:760px; padding:24px; box-shadow:var(--shadow); margin-bottom:40px;
  }
  .modal h2{margin-top:0;}
  .hidden{display:none !important;}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .form-grid .full{grid-column:1 / -1;}
  label{font-size:13px; color:var(--muted); display:block; margin-bottom:6px;}
  input[type=text], input[type=number], textarea, select{
    width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-family:inherit; font-size:14px;
  }
  textarea{resize:vertical; min-height:60px;}
  .checks{display:flex; gap:14px; flex-wrap:wrap; padding:8px 0;}
  .checks label{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text); margin:0;}

  .img-drop{
    border:1.5px dashed var(--border); border-radius:10px; padding:12px; text-align:center;
    font-size:13px; color:var(--muted); cursor:pointer; position:relative;
  }
  .img-drop.has-img{padding:0; border-style:solid;}
  .img-drop img{width:100%; max-height:160px; object-fit:cover; border-radius:9px; display:block;}
  .img-drop input{position:absolute; inset:0; opacity:0; cursor:pointer;}

  .gallery-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:8px; margin-top:8px;}
  .gallery-item{position:relative; border-radius:8px; overflow:hidden; border:1px solid var(--border); aspect-ratio:1;}
  .gallery-item img{width:100%; height:100%; object-fit:cover; cursor:zoom-in;}
  .gallery-item .rm{
    position:absolute; top:3px; left:3px; background:rgba(0,0,0,.6); color:#fff; border:none;
    border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer; line-height:1;
  }
  .gallery-count{font-size:12px; color:var(--muted); margin-top:6px;}

  .form-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px; flex-wrap:wrap;}

  .detail-section{margin-bottom:16px;}
  .detail-section h4{margin:0 0 6px; font-size:13px; color:var(--gold);}
  .detail-section p{margin:0; font-size:14px; line-height:1.8; white-space:pre-wrap;}
  .detail-imgs{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .detail-imgs figure{margin:0;}
  .detail-imgs img{width:100%; border-radius:10px; border:1px solid var(--border);}
  .detail-imgs figcaption{font-size:12px; color:var(--muted); margin-top:4px; text-align:center;}
  .kpis{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .kpi{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 14px; flex:1; min-width:120px;}
  .kpi .l{font-size:11px; color:var(--muted);}
  .kpi .v{font-size:17px; font-weight:700;}

  .lightbox{position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:8px;}

  #printArea{display:none;}
  @media print{
    @page{ size:A4; margin:14mm; }
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; inset:0; padding:0; color:#1a1f2b; background:#fff;
      font-family:"B Yekan","BYekan","Yekan","Vazirmatn",Tahoma,sans-serif;}

    .p-header{
      text-align:center; margin-bottom:9mm; padding-bottom:6mm;
      position:relative;
    }
    .p-header::after{
      content:""; display:block; width:60mm; height:2px; background:#c9a227; margin:5mm auto 0;
    }
    .p-header h1{font-size:27px; margin:0; color:#12151f; font-weight:700;}
    .p-header .p-sub{font-size:11px; color:#9a9fac; letter-spacing:2px; margin-top:4px; text-transform:uppercase;}
    .p-badges{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:8mm;}
    .p-badge{
      font-size:11px; padding:4px 12px; border-radius:20px; border:1px solid #c9a227;
      color:#8a6d00; background:#fbf3dd;
    }
    .p-kpis{display:flex; gap:8mm; margin-bottom:9mm;}
    .p-kpi{
      flex:1; border:1px solid #e2e5ec; border-radius:10px; padding:10px 12px; background:#f7f8fb;
      text-align:center; box-shadow:0 1px 0 rgba(0,0,0,.02);
    }
    .p-kpi .l{font-size:10px; color:#8a8f9c; margin-bottom:4px; letter-spacing:.5px;}
    .p-kpi .v{font-size:18px; font-weight:700; color:#8a6d00;}
    .p-imgs{display:flex; gap:8mm; margin-bottom:9mm; page-break-inside:avoid;}
    .p-imgs figure{flex:1; margin:0; border:1px solid #e2e5ec; border-radius:10px; padding:6px; background:#fafbfc;}
    .p-imgs img{width:100%; border-radius:6px; display:block;}
    .p-imgs figcaption{font-size:11px; text-align:center; color:#666; margin-top:5px; font-weight:600;}
    .p-section{margin-bottom:7mm; page-break-inside:avoid; background:#fafbfc; border:1px solid #eef0f4; border-radius:8px; padding:7px 12px;}
    .p-section h4{
      font-size:12.5px; color:#8a6d00; margin:0 0 4px; border-bottom:1px solid #eee2bd; padding-bottom:4px;
      display:flex; align-items:center; gap:6px;
    }
    .p-section h4::before{content:"◆"; font-size:8px; color:#c9a227;}
    .p-section p{margin:0; font-size:12.5px; line-height:1.9; white-space:pre-wrap; color:#2b2f3a;}
    .p-quote{background:#fef7f7; border:1px solid #fbdede;}
    .p-quote h4{border-bottom-color:#f6c9c9;}
    .p-quote h4::before{color:#f87171;}
    .p-gallery-title{
      font-size:16px; color:#12151f; text-align:center; margin-bottom:9mm; padding-bottom:5mm;
      page-break-before:always; position:relative;
    }
    .p-gallery-title::after{
      content:""; display:block; width:40mm; height:2px; background:#c9a227; margin:4mm auto 0;
    }
    .p-gallery-item{
      width:100%; height:135mm; margin-bottom:8mm; page-break-inside:avoid;
      border:1px solid #e2e5ec; border-radius:10px; padding:5mm; background:#fafbfc;
    }
    .p-gallery-item .p-gallery-caption{font-size:10px; color:#8a8f9c; text-align:left; margin-bottom:3px;}
    .p-gallery-item img{width:100%; height:100%; object-fit:contain; border-radius:6px;}
  }
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span> دفترچه استراتژی‌های ترید</h1>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="جستجو در نام، سایکل، توضیحات...">
  </div>
  <div style="display:flex; gap:8px;">
    <button class="btn" id="exportBtn">پشتیبان‌گیری (JSON)</button>
    <button class="btn" id="importBtn">بازیابی فایل</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
    <button class="btn primary" id="addBtn">+ استراتژی جدید</button>
  </div>
</header>

<main>
  <div class="filter-panel">
    <div class="filter-group">
      <div class="ftitle">فیلتر مارکت سایکل</div>
      <div class="filter-chips" id="cycleFilterChips">
        <span class="chip" data-cycle="TR">TR — رنج</span>
        <span class="chip" data-cycle="Ch">Ch — کانال</span>
        <span class="chip" data-cycle="SP">SP — اسپایک</span>
        <span class="chip" data-cycle="V">V — الگوی وی</span>
      </div>
    </div>
    <div class="filter-group">
      <div class="ftitle">حداقل وین‌ریت (%)</div>
      <input type="number" id="minWinRateFilter" min="0" max="100" placeholder="مثلاً 50">
    </div>
    <div class="filter-group">
      <div class="ftitle">مرتب‌سازی</div>
      <select id="sortFilter">
        <option value="newest">جدیدترین</option>
        <option value="winrate_desc">وین‌ریت (بیشترین)</option>
        <option value="winrate_asc">وین‌ریت (کمترین)</option>
        <option value="name">نام (الفبا)</option>
      </select>
    </div>
    <button class="btn small filter-reset" id="resetFiltersBtn">پاک کردن فیلترها</button>
  </div>
  <div class="stats-bar" id="statsBar"></div>
  <div class="grid" id="dashboard"></div>
</main>

<!-- Form Modal -->
<div class="modal-overlay hidden" id="formOverlay">
  <div class="modal">
    <h2 id="formTitle">استراتژی جدید</h2>
    <div class="form-grid">
      <div class="full">
        <label>اسم استراتژی *</label>
        <input type="text" id="f_name" placeholder="مثلاً شکست کانال صعودی">
      </div>

      <div class="full">
        <label>مارکت سایکل</label>
        <div class="checks">
          <label><input type="checkbox" value="TR" class="f_cycle"> TR — تریدینگ رنج</label>
          <label><input type="checkbox" value="Ch" class="f_cycle"> Ch — کانال</label>
          <label><input type="checkbox" value="SP" class="f_cycle"> SP — اسپایک</label>
          <label><input type="checkbox" value="V" class="f_cycle"> V — الگوی وی</label>
        </div>
      </div>

      <div>
        <label>عکس در حالت صعودی</label>
        <div class="img-drop" id="drop_bull">
          <span>برای انتخاب عکس کلیک کنید</span>
          <input type="file" accept="image/*" id="f_bullImg">
        </div>
      </div>
      <div>
        <label>عکس در حالت نزولی</label>
        <div class="img-drop" id="drop_bear">
          <span>برای انتخاب عکس کلیک کنید</span>
          <input type="file" accept="image/*" id="f_bearImg">
        </div>
      </div>

      <div class="full">
        <label>توضیحات</label>
        <textarea id="f_desc"></textarea>
      </div>

      <div class="full">
        <label>نقطه ورود</label>
        <textarea id="f_entry" style="min-height:44px;"></textarea>
      </div>
      <div>
        <label>حد سود (Take Profit)</label>
        <input type="text" id="f_tp">
      </div>
      <div>
        <label>حد ضرر (Stop Loss)</label>
        <input type="text" id="f_sl">
      </div>

      <div>
        <label>وین‌ریت (%)</label>
        <input type="number" id="f_winrate" min="0" max="100">
      </div>
      <div>
        <label>تعداد بک‌تست (n)</label>
        <input type="number" id="f_backtestN" min="0">
      </div>

      <div class="full">
        <label>ریسک به ریوارد استفاده شده</label>
        <input type="text" id="f_rr" placeholder="مثلاً 1:2">
      </div>

      <div class="full">
        <label>چه کسی در این استراتژی ضرر می‌کند؟</label>
        <textarea id="f_wholoses"></textarea>
      </div>

      <div class="full">
        <label>فیلترها</label>
        <textarea id="f_filters"></textarea>
      </div>

      <div class="full">
        <label>ساده‌سازی</label>
        <textarea id="f_simplify"></textarea>
      </div>

      <div class="full">
        <label>حالت ایده‌آل</label>
        <textarea id="f_ideal"></textarea>
      </div>

      <div class="full">
        <label>گالری تصاویر (حداکثر ۵۰ عکس) — <span id="galleryCount">0/50</span></label>
        <div class="img-drop" id="drop_gallery">
          <span>برای افزودن چند عکس کلیک کنید</span>
          <input type="file" accept="image/*" id="f_gallery" multiple>
        </div>
        <div class="gallery-grid" id="galleryPreview"></div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn" id="cancelFormBtn">انصراف</button>
      <button class="btn primary" id="saveBtn">ذخیره استراتژی</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay hidden" id="detailOverlay">
  <div class="modal" style="max-width:840px;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
      <h2 id="d_name" style="margin:0;"></h2>
      <div style="display:flex; gap:8px;">
        <button class="btn small gold" id="d_pdfBtn">خروجی PDF</button>
        <button class="btn small" id="d_editBtn">ویرایش</button>
        <button class="btn small danger" id="d_deleteBtn">حذف</button>
        <button class="btn small" id="d_closeBtn">بستن ✕</button>
      </div>
    </div>
    <div id="detailBody" style="margin-top:16px;"></div>
  </div>
</div>

<div id="printArea"></div>

<script>
const CYCLE_LABELS = {TR:'تریدینگ رنج', Ch:'کانال', SP:'اسپایک', V:'الگوی وی'};
const STORAGE_KEY = 'tradingStrategies_v1';
let strategies = [];
let editingId = null;
let currentDetailId = null;
let galleryTemp = [];
let activeCycleFilters = new Set();
let minWinRateFilter = 0;
let sortBy = 'newest';

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    strategies = raw ? JSON.parse(raw) : [];
  }catch(e){ strategies = []; }
}
function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(strategies));
  }catch(e){
    alert('ذخیره‌سازی با خطا مواجه شد. احتمالاً حجم تصاویر زیاد است و فضای مرورگر پر شده. لطفاً برخی عکس‌های گالری را کم کنید یا از پشتیبان‌گیری JSON استفاده کنید.');
  }
}

function resizeImage(file, maxWidth=1100, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * maxWidth/w); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- Dashboard rendering ----------
function renderStats(){
  const bar = document.getElementById('statsBar');
  const total = strategies.length;
  const avgWin = total ? (strategies.reduce((s,x)=>s+(Number(x.winRate)||0),0)/total).toFixed(1) : 0;
  const cycles = {};
  strategies.forEach(s=> (s.cycles||[]).forEach(c=> cycles[c]=(cycles[c]||0)+1));
  const topCycle = Object.entries(cycles).sort((a,b)=>b[1]-a[1])[0];
  bar.innerHTML = `
    <div class="stat"><div class="label">تعداد استراتژی‌ها</div><div class="value">${total}</div></div>
    <div class="stat"><div class="label">میانگین وین‌ریت</div><div class="value">${avgWin}%</div></div>
    <div class="stat"><div class="label">پرتکرارترین سایکل</div><div class="value">${topCycle? CYCLE_LABELS[topCycle[0]]+' ('+topCycle[1]+')' : '—'}</div></div>
  `;
}

function renderDashboard(){
  renderStats();
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('dashboard');
  let list = strategies.slice();

  // فیلتر بر اساس مارکت سایکل
  if(activeCycleFilters.size){
    list = list.filter(s => (s.cycles||[]).some(c => activeCycleFilters.has(c)));
  }
  // فیلتر بر اساس حداقل وین‌ریت
  if(minWinRateFilter > 0){
    list = list.filter(s => (Number(s.winRate)||0) >= minWinRateFilter);
  }
  // جستجوی متنی
  if(q){
    list = list.filter(s=>{
      const hay = [s.name, (s.cycles||[]).map(c=>CYCLE_LABELS[c]).join(' '), s.description, s.entry, s.tp, s.sl, s.rr, s.wholoses, s.filters, s.simplify, s.ideal].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  // مرتب‌سازی
  if(sortBy==='winrate_desc') list.sort((a,b)=> (Number(b.winRate)||0)-(Number(a.winRate)||0));
  else if(sortBy==='winrate_asc') list.sort((a,b)=> (Number(a.winRate)||0)-(Number(b.winRate)||0));
  else if(sortBy==='name') list.sort((a,b)=> (a.name||'').localeCompare(b.name||'','fa'));
  else list.sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));

  if(!list.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">هیچ استراتژی‌ای ثبت نشده یا با جستجوی شما مطابقت ندارد.</div>`;
    return;
  }
  grid.innerHTML = list.map(s=>`
    <div class="card" onclick="openDetail('${s.id}')">
      <div class="thumb-row">
        ${s.bullImg ? `<img src="${s.bullImg}">` : `<div style="width:50%;height:80px;background:#0c1120;border-radius:8px;"></div>`}
        ${s.bearImg ? `<img src="${s.bearImg}">` : `<div style="width:50%;height:80px;background:#0c1120;border-radius:8px;"></div>`}
      </div>
      <h3>${escapeHtml(s.name||'بدون نام')}</h3>
      <div class="badges">${(s.cycles||[]).map(c=>`<span class="badge">${c} — ${CYCLE_LABELS[c]}</span>`).join('')}</div>
      <div class="meta">
        <span>وین‌ریت: <b>${s.winRate||0}%</b> (n=${s.backtestN||0})</span>
        <span>R:R <b>${escapeHtml(s.rr||'-')}</b></span>
      </div>
    </div>
  `).join('');
}
function escapeHtml(str){
  if(!str) return '';
  return str.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- Form handling ----------
function resetForm(){
  document.getElementById('f_name').value='';
  document.querySelectorAll('.f_cycle').forEach(c=>c.checked=false);
  document.getElementById('f_desc').value='';
  document.getElementById('f_entry').value='';
  document.getElementById('f_tp').value='';
  document.getElementById('f_sl').value='';
  document.getElementById('f_winrate').value='';
  document.getElementById('f_backtestN').value='';
  document.getElementById('f_rr').value='';
  document.getElementById('f_wholoses').value='';
  document.getElementById('f_filters').value='';
  document.getElementById('f_simplify').value='';
  document.getElementById('f_ideal').value='';
  setDropImage('drop_bull', null);
  setDropImage('drop_bear', null);
  galleryTemp = [];
  renderGalleryPreview();
}
function setDropImage(dropId, dataUrl){
  const el = document.getElementById(dropId);
  if(dataUrl){
    el.classList.add('has-img');
    el.innerHTML = `<img src="${dataUrl}"><input type="file" accept="image/*" id="${dropId==='drop_bull'?'f_bullImg':'f_bearImg'}">`;
  }else{
    el.classList.remove('has-img');
    el.innerHTML = `<span>برای انتخاب عکس کلیک کنید</span><input type="file" accept="image/*" id="${dropId==='drop_bull'?'f_bullImg':'f_bearImg'}">`;
  }
  bindImgInput(dropId);
}
function bindImgInput(dropId){
  const inputId = dropId==='drop_bull' ? 'f_bullImg' : 'f_bearImg';
  const input = document.getElementById(inputId);
  input.addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    const dataUrl = await resizeImage(file, 1100, 0.75);
    setDropImage(dropId, dataUrl);
    input.dataset.value = dataUrl;
  });
}
function getDropValue(dropId){
  const img = document.querySelector('#'+dropId+' img');
  return img ? img.getAttribute('src') : null;
}

function renderGalleryPreview(){
  const wrap = document.getElementById('galleryPreview');
  document.getElementById('galleryCount').textContent = galleryTemp.length + '/50';
  wrap.innerHTML = galleryTemp.map((src,i)=>`
    <div class="gallery-item">
      <img src="${src}" onclick="openLightbox('${i}')">
      <button class="rm" onclick="removeGalleryImg(event,${i})">✕</button>
    </div>
  `).join('');
}
function removeGalleryImg(e, idx){
  e.stopPropagation();
  galleryTemp.splice(idx,1);
  renderGalleryPreview();
}
document.getElementById('f_gallery').addEventListener('change', async e=>{
  const files = Array.from(e.target.files);
  const remaining = 50 - galleryTemp.length;
  if(files.length > remaining){
    alert('حداکثر ۵۰ عکس در گالری مجاز است. تعداد ' + remaining + ' عکس دیگر می‌توانید اضافه کنید.');
  }
  const toAdd = files.slice(0, remaining);
  for(const f of toAdd){
    const dataUrl = await resizeImage(f, 900, 0.65);
    galleryTemp.push(dataUrl);
  }
  renderGalleryPreview();
  e.target.value = '';
});

function openForm(id){
  editingId = id || null;
  resetForm();
  document.getElementById('formTitle').textContent = id ? 'ویرایش استراتژی' : 'استراتژی جدید';
  if(id){
    const s = strategies.find(x=>x.id===id);
    document.getElementById('f_name').value = s.name||'';
    document.querySelectorAll('.f_cycle').forEach(c=> c.checked = (s.cycles||[]).includes(c.value));
    document.getElementById('f_desc').value = s.description||'';
    document.getElementById('f_entry').value = s.entry||'';
    document.getElementById('f_tp').value = s.tp||'';
    document.getElementById('f_sl').value = s.sl||'';
    document.getElementById('f_winrate').value = s.winRate||'';
    document.getElementById('f_backtestN').value = s.backtestN||'';
    document.getElementById('f_rr').value = s.rr||'';
    document.getElementById('f_wholoses').value = s.wholoses||'';
    document.getElementById('f_filters').value = s.filters||'';
    document.getElementById('f_simplify').value = s.simplify||'';
    document.getElementById('f_ideal').value = s.ideal||'';
    if(s.bullImg) setDropImage('drop_bull', s.bullImg);
    if(s.bearImg) setDropImage('drop_bear', s.bearImg);
    galleryTemp = (s.gallery||[]).slice();
    renderGalleryPreview();
  }
  document.getElementById('formOverlay').classList.remove('hidden');
}
function closeForm(){
  document.getElementById('formOverlay').classList.add('hidden');
}

document.getElementById('addBtn').addEventListener('click', ()=>openForm(null));
document.getElementById('cancelFormBtn').addEventListener('click', closeForm);
bindImgInput('drop_bull');
bindImgInput('drop_bear');

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert('لطفاً اسم استراتژی را وارد کنید.'); return; }
  const cycles = Array.from(document.querySelectorAll('.f_cycle:checked')).map(c=>c.value);
  const data = {
    id: editingId || ('s_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)),
    name,
    cycles,
    bullImg: getDropValue('drop_bull'),
    bearImg: getDropValue('drop_bear'),
    description: document.getElementById('f_desc').value.trim(),
    entry: document.getElementById('f_entry').value.trim(),
    tp: document.getElementById('f_tp').value.trim(),
    sl: document.getElementById('f_sl').value.trim(),
    winRate: Number(document.getElementById('f_winrate').value)||0,
    backtestN: Number(document.getElementById('f_backtestN').value)||0,
    rr: document.getElementById('f_rr').value.trim(),
    wholoses: document.getElementById('f_wholoses').value.trim(),
    filters: document.getElementById('f_filters').value.trim(),
    simplify: document.getElementById('f_simplify').value.trim(),
    ideal: document.getElementById('f_ideal').value.trim(),
    gallery: galleryTemp.slice(),
    createdAt: editingId ? (strategies.find(x=>x.id===editingId)||{}).createdAt || Date.now() : Date.now(),
    updatedAt: Date.now()
  };
  if(editingId){
    const idx = strategies.findIndex(x=>x.id===editingId);
    strategies[idx] = data;
  }else{
    strategies.push(data);
  }
  saveData();
  closeForm();
  renderDashboard();
});

// ---------- Detail view ----------
function openDetail(id){
  currentDetailId = id;
  const s = strategies.find(x=>x.id===id);
  if(!s) return;
  document.getElementById('d_name').textContent = s.name;
  const body = document.getElementById('detailBody');
  body.innerHTML = `
    <div class="badges" style="margin-bottom:14px;">${(s.cycles||[]).map(c=>`<span class="badge">${c} — ${CYCLE_LABELS[c]}</span>`).join('') || '<span class="badge">بدون سایکل مشخص</span>'}</div>
    <div class="kpis">
      <div class="kpi"><div class="l">وین‌ریت</div><div class="v">${s.winRate||0}%</div></div>
      <div class="kpi"><div class="l">تعداد بک‌تست</div><div class="v">${s.backtestN||0}</div></div>
      <div class="kpi"><div class="l">ریسک به ریوارد</div><div class="v">${escapeHtml(s.rr||'-')}</div></div>
    </div>
    ${(s.bullImg||s.bearImg) ? `
    <div class="detail-imgs" style="margin-bottom:16px;">
      <figure>${s.bullImg?`<img src="${s.bullImg}">`:''}<figcaption>حالت صعودی</figcaption></figure>
      <figure>${s.bearImg?`<img src="${s.bearImg}">`:''}<figcaption>حالت نزولی</figcaption></figure>
    </div>`:''}
    ${detailBlock('توضیحات', s.description)}
    ${detailBlock('نقطه ورود', s.entry)}
    ${detailBlock('حد سود', s.tp)}
    ${detailBlock('حد ضرر', s.sl)}
    ${detailBlock('چه کسی در این استراتژی ضرر می‌کند؟', s.wholoses)}
    ${detailBlock('فیلترها', s.filters)}
    ${detailBlock('ساده‌سازی', s.simplify)}
    ${detailBlock('حالت ایده‌آل', s.ideal)}
    ${s.gallery && s.gallery.length ? `
      <div class="detail-section">
        <h4>گالری تصاویر (${s.gallery.length})</h4>
        <div class="gallery-grid">${s.gallery.map((g,i)=>`<div class="gallery-item"><img src="${g}" onclick="openLightbox('${i}','${s.id}')"></div>`).join('')}</div>
      </div>`:''}
  `;
  document.getElementById('detailOverlay').classList.remove('hidden');
}
function detailBlock(title, content){
  if(!content) return '';
  return `<div class="detail-section"><h4>${title}</h4><p>${escapeHtml(content)}</p></div>`;
}
document.getElementById('d_closeBtn').addEventListener('click', ()=>{
  document.getElementById('detailOverlay').classList.add('hidden');
});
document.getElementById('d_editBtn').addEventListener('click', ()=>{
  document.getElementById('detailOverlay').classList.add('hidden');
  openForm(currentDetailId);
});
document.getElementById('d_deleteBtn').addEventListener('click', ()=>{
  if(confirm('آیا از حذف این استراتژی مطمئن هستید؟')){
    strategies = strategies.filter(x=>x.id!==currentDetailId);
    saveData();
    document.getElementById('detailOverlay').classList.add('hidden');
    renderDashboard();
  }
});

// ---------- Lightbox ----------
function openLightbox(idx, sid){
  const s = sid ? strategies.find(x=>x.id===sid) : strategies.find(x=>x.id===currentDetailId);
  const src = s.gallery[idx];
  const lb = document.createElement('div');
  lb.className='lightbox';
  lb.innerHTML = `<img src="${src}">`;
  lb.addEventListener('click', ()=>lb.remove());
  document.body.appendChild(lb);
}

// ---------- PDF Export (print) ----------

  if(!s) return;
  const printArea = document.getElementById('printArea');
  printArea.innerHTML = `
    <div dir="rtl">
      <div class="p-header">
        <h1>${escapeHtml(s.name)}</h1>
        <div class="p-sub">گزارش استراتژی معاملاتی</div>
      </div>

      <div class="p-badges">
        ${(s.cycles||[]).map(c=>`<span class="p-badge">${c} — ${CYCLE_LABELS[c]}</span>`).join('') || '<span class="p-badge">بدون سایکل مشخص</span>'}
      </div>

      <div class="p-kpis">
        <div class="p-kpi"><div class="l">وین‌ریت</div><div class="v">${s.winRate||0}%</div></div>
        <div class="p-kpi"><div class="l">تعداد بک‌تست</div><div class="v">${s.backtestN||0}</div></div>
        <div class="p-kpi"><div class="l">ریسک به ریوارد</div><div class="v">${escapeHtml(s.rr||'-')}</div></div>
      </div>

      ${(s.bullImg||s.bearImg)?`
      <div class="p-imgs">
        ${s.bullImg?`<figure><img src="${s.bullImg}"><figcaption>📈 حالت صعودی</figcaption></figure>`:''}
        ${s.bearImg?`<figure><img src="${s.bearImg}"><figcaption>📉 حالت نزولی</figcaption></figure>`:''}
      </div>`:''}

      ${pdfBlock('توضیحات', s.description)}
      ${pdfBlock('نقطه ورود', s.entry)}
      ${pdfBlock('حد سود', s.tp)}
      ${pdfBlock('حد ضرر', s.sl)}
      ${pdfBlock('چه کسی در این استراتژی ضرر می‌کند؟', s.wholoses, true)}
      ${pdfBlock('فیلترها', s.filters)}
      ${pdfBlock('ساده‌سازی', s.simplify)}
      ${pdfBlock('حالت ایده‌آل', s.ideal)}

      ${s.gallery && s.gallery.length ? `
        <div class="p-gallery-title">گالری تصاویر (${s.gallery.length} عکس)</div>
        ${s.gallery.map((g,i)=>`
          <div class="p-gallery-item">
            <div class="p-gallery-caption">تصویر ${i+1} از ${s.gallery.length}</div>
            <img src="${g}">
          </div>`).join('')}
      ` : ''}
    </div>
  `;
  const prevTitle = document.title;

});
function pdfBlock(title, content, quote){
  if(!content) return '';
  const cls = quote ? 'p-section p-quote' : 'p-section';
  return `<div class="${cls}"><h4>${title}</h4><p>${escapeHtml(content)}</p></div>`;
}

// ---------- Backup / Restore ----------
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(strategies,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'trading-strategies-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
});
document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const imported = JSON.parse(ev.target.result);
      if(!Array.isArray(imported)) throw new Error('فرمت نامعتبر');
      if(confirm('آیا داده‌های وارد شده جایگزین/اضافه به لیست فعلی شوند؟ (تأیید = افزودن به لیست فعلی)')){
        const existingIds = new Set(strategies.map(s=>s.id));
        imported.forEach(s=>{ if(!existingIds.has(s.id)) strategies.push(s); });
      }else{
        strategies = imported;
      }
      saveData();
      renderDashboard();
      alert('بازیابی با موفقیت انجام شد.');
    }catch(err){
      alert('فایل انتخابی معتبر نیست.');
    }
  };
  reader.readAsText(file);
  e.target.value='';
});

document.getElementById('searchInput').addEventListener('input', renderDashboard);

// ---------- Filter panel ----------
document.querySelectorAll('#cycleFilterChips .chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    const c = chip.dataset.cycle;
    if(activeCycleFilters.has(c)){ activeCycleFilters.delete(c); chip.classList.remove('active'); }
    else{ activeCycleFilters.add(c); chip.classList.add('active'); }
    renderDashboard();
  });
});
document.getElementById('minWinRateFilter').addEventListener('input', e=>{
  minWinRateFilter = Number(e.target.value)||0;
  renderDashboard();
});
document.getElementById('sortFilter').addEventListener('change', e=>{
  sortBy = e.target.value;
  renderDashboard();
});
document.getElementById('resetFiltersBtn').addEventListener('click', ()=>{
  activeCycleFilters.clear();
  document.querySelectorAll('#cycleFilterChips .chip').forEach(c=>c.classList.remove('active'));
  document.getElementById('minWinRateFilter').value='';
  minWinRateFilter = 0;
  document.getElementById('sortFilter').value='newest';
  sortBy='newest';
  renderDashboard();
});

// init
loadData();
renderDashboard();
</script>
